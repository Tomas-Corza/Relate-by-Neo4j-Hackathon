[theme]
base="dark"
primaryColor="#20d8d0"
backgroundColor="#0b1420"
secondaryBackgroundColor="#142333"
textColor="#edf5fa"
font="sans serif"
[server]
headless=true
enableCORS=true
enableXsrfProtection=true
maxUploadSize=1
maxMessageSize=10
[client]
showErrorDetails="none"
[browser]
gatherUsageStats=false
