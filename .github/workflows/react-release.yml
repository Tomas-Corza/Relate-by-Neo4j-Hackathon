name: React release validation
on:
  pull_request:
  push:
    branches: [design/react-workspace]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-preview.txt
      - run: python -m unittest discover -s tests -v
      - run: python -c "from preview_api import overview; d=overview('linear'); assert d['economics']['first_observed_purchasers']==60; assert len(d['campaigns'])==4"
