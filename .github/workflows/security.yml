name: Security audit
on:
  push:
  pull_request:
  schedule:
    - cron: '23 10 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/check_secrets.py
      - run: python -m pip install -r requirements.txt pip-audit
      - run: python -m pip_audit
